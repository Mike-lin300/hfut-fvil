{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FVIL 飞行器创新实验室{% endblock %}</title>
    {# bootstrap 5 #}
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    {# 自定义样式，实验室蓝变量、按钮主题 #}
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
{# 导航栏模板 #}
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: var(--accent);">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">FVIL 飞行器创新实验室</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"
                aria-controls="navMain" aria-expanded="false" aria-label="切换导航">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'lab_profile' %}active{% endif %}" href="/about/">实验室介绍</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'lab_teachers' %}active{% endif %}" href="/about/teachers/">指导老师</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'guide' %}active{% endif %}" href="/guide/">导学资料</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'doclib_home' %}active{% endif %}" href="/doclib/">材料库</a></li>
                <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'recruit_home' %}active{% endif %}" href="/recruit/">招新入口</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="{% block main_class %}container py-4{% endblock %}">
    {% block content %}{% endblock %}
</main>

<footer class="footer py-3" style="background-color: #f2f5f9;">
    <div class="container text-center text-muted small">
        © 2026 合肥工业大学 飞行器创新实验室（FVIL）· 业务平台
    </div>
</footer>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
